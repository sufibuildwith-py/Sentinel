spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

gemini:
  api-key: ${GEMINI_API_KEY:local-development-key}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
  request-timeout: ${GEMINI_REQUEST_TIMEOUT:30s}

runbooks:
  path: runbooks
  top-k: 1
  minimum-similarity: -1.0

sentinel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    demo-requests-per-minute: ${RATE_LIMIT_DEMO_PER_MINUTE:10}
    execution-requests-per-minute: ${RATE_LIMIT_EXECUTION_PER_MINUTE:5}
    evaluation-requests-per-minute: ${RATE_LIMIT_EVALUATION_PER_MINUTE:3}
    webhook-requests-per-minute: ${RATE_LIMIT_WEBHOOK_PER_MINUTE:60}
  evaluation:
    seed: 20260901
    scenarios-per-category: 16
    report-version: phase9-v1
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    connect-timeout: 2s
    request-timeout: 5s
    action-expiry: 30m
    link-expiry: 24h
    maximum-attempts: 3
    circuit-breaker-failure-rate: 50
    circuit-breaker-minimum-calls: 3
    circuit-breaker-window-size: 6
    circuit-breaker-open-duration: 30s
    notifications-enabled: false
    webhook:
      secret: ${RAZORPAY_WEBHOOK_SECRET:}
  recovery:
    worker:
      enabled: ${RECOVERY_WORKER_ENABLED:true}
      fixed-delay: ${RECOVERY_WORKER_DELAY:30000}
  policy:
    auto-confidence-threshold: 0.85
    maximum-auto-amount-minor: 100000
    maximum-attempts: 3
    per-customer-action-limit: 2
    maximum-risk-score: 0.70
    action-ttl: 30m
    allowed-strategies:
      - ALTERNATIVE_PAYMENT_LINK
      - DEFERRED_RETRY
      - RECOVERY_REMINDER
      - WAIT_FOR_PROVIDER
    paid-or-refunded-statuses:
      - CAPTURED
      - AUTHORIZED
      - PAID
      - REFUNDED
  investigation:
    timeout: 5s
    memory-top-k: 5
    memory-minimum-similarity: 0.35
    circuit-breaker-failure-rate: 50
    circuit-breaker-minimum-calls: 2
    circuit-breaker-window-size: 4
    circuit-breaker-open-duration: 30s
  detection:
    evaluation-window: 60m
    cluster-window: 60m
    baseline-window: 24h
    baseline-bucket: 15m
    minimum-volume: 10
    minimum-success-rate-drop: 0.20
    minimum-baseline-deviation: 2.0
    minimum-amount-at-risk-minor: 100000
    default-baseline-success-rate: 0.95
    minimum-baseline-standard-deviation: 0.05
    success-statuses:
      - CAPTURED
      - AUTHORIZED
    merchant-metadata-key: merchantId
  payment-health:
    minimum-volume: 10
    success-rate-drop: 0.20
    failure-rate-increase: 0.20
    failure-velocity-multiplier: 2.0
    concentration-threshold: 0.60
    revenue-exposure-minor: 100000
    recovery-tool-error-rate: 0.30
  governor:
    max-total-value-minor: 10000000
    max-incidents: 100
    max-value-per-incident-minor: 100000
    max-provider-calls-per-minute: 30
    max-customer-contacts: 20
    max-retry-count: 3
    max-concurrent-jobs: 10
    max-tool-failure-rate: 0.25
    max-unreconciled-value-minor: 500000
    canary-size: 2
    required-reconciled-count: 2
  communication:
    quiet-hours-start: "21:00"
    quiet-hours-end: "08:00"
    max-contacts-per-24-hours: 2
    maximum-promise-days: 30
    allowed-templates:
      - PAYMENT_RECOVERY_LINK
      - PAYMENT_REMINDER
      - PROMISE_REMINDER
  opportunity:
    maturity: M0
    mode: SHADOW_ONLY

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: sentinel

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

razorpay:
  enabled: ${RAZORPAY_ENABLED:false}
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: false
      razorpay:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: false
  retry:
    instances:
      gemini:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
      razorpay:
        max-attempts: 2
        wait-duration: 1s
  timelimiter:
    instances:
      gemini:
        timeout-duration: 30s
        cancel-running-future: true
      razorpay:
        timeout-duration: 10s
        cancel-running-future: true
