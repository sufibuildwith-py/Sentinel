server.port=8080

# Secrets are supplied by the environment and never stored in source control.
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:30s}

# Retrieval defaults preserve the prototype's top-one behaviour.
runbooks.path=runbooks
runbooks.top-k=1
runbooks.minimum-similarity=-1.0

# Do not expose framework exception details or messages in default error responses.
server.error.include-message=never
server.error.include-stacktrace=never

# PostgreSQL is the only persistence backend. Tests override these values with a
# real PostgreSQL Testcontainer; Hibernate validates the Flyway-owned schema.
spring.datasource.url=${SENTINEL_DB_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${SENTINEL_DB_USERNAME:sentinel}
spring.datasource.password=${SENTINEL_DB_PASSWORD:sentinel}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
