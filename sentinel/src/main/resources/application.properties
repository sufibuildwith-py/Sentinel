server.port=8080

# Set this as a real environment variable, never hardcode a key in this file.
# PowerShell: $env:GEMINI_API_KEY="your_key_here" before running the app
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash

# Folder the app reads .txt runbooks from at startup - relative to wherever you run `mvn spring-boot:run` from
runbooks.path=runbooks
